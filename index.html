<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lo siento mucho... 💜</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght={500;700}&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #eedffc, #e9d5ff, #f3e8ff);
        font-family: "Quicksand", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #4c1d95;
        overflow: hidden;
        position: relative;
        padding: 15px;
      }

      /* Canvas para la nieve */
      #snowCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* Tarjeta contenedor */
      .card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 4px solid rgba(255, 255, 255, 0.6);
        border-radius: 35px;
        padding: 30px 20px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2);
        animation: floating 4s ease-in-out infinite;
        z-index: 10;
        position: relative;
      }

      @keyframes floating {
        0% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(0.5deg);
        }
        100% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      .title {
        font-family: "Fredoka One", cursive;
        font-size: 2.2rem;
        color: #7e22ce;
        text-shadow: 2px 2px 0px #fae8ff;
        margin-bottom: 15px;
      }

      /* --- PELUCHE HECHO CON CSS PURO --- */
      .teddy-bear {
        width: 120px;
        height: 120px;
        margin: 10px auto 20px auto;
        position: relative;
        animation: pulse 2.5s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Cabeza del oso */
      .teddy-head {
        width: 100px;
        height: 90px;
        background: #c084fc;
        border-radius: 50% 50% 45% 45%;
        position: absolute;
        bottom: 10px;
        left: 10px;
        box-shadow:
          inset -5px -5px 10px rgba(126, 34, 206, 0.3),
          0 5px 10px rgba(0, 0, 0, 0.1);
      }

      /* Orejas */
      .teddy-ear {
        width: 35px;
        height: 35px;
        background: #c084fc;
        border-radius: 50%;
        position: absolute;
        top: 5px;
        box-shadow: inset -2px -2px 5px rgba(126, 34, 206, 0.3);
      }
      .teddy-ear.left {
        left: 5px;
      }
      .teddy-ear.right {
        right: 5px;
      }

      .teddy-ear-inner {
        width: 20px;
        height: 20px;
        background: #f3e8ff;
        border-radius: 50%;
        position: absolute;
        top: 7px;
        left: 7px;
      }

      /* Ojos */
      .teddy-eye {
        width: 10px;
        height: 12px;
        background: #2e1065;
        border-radius: 50%;
        position: absolute;
        top: 35px;
      }
      .teddy-eye.left {
        left: 30px;
      }
      .teddy-eye.right {
        right: 30px;
      }

      .teddy-eye::after {
        content: "";
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        left: 2px;
      }

      /* Hocico */
      .teddy-muzzle {
        width: 38px;
        height: 28px;
        background: #f3e8ff;
        border-radius: 50%;
        position: absolute;
        bottom: 18px;
        left: 31px;
      }

      /* Nariz */
      .teddy-nose {
        width: 14px;
        height: 9px;
        background: #581c87;
        border-radius: 50% 50% 40% 40%;
        position: absolute;
        top: 5px;
        left: 12px;
      }

      /* Mejillas sonrojadas */
      .teddy-blush {
        width: 15px;
        height: 10px;
        background: rgba(244, 63, 94, 0.4);
        border-radius: 50%;
        position: absolute;
        top: 45px;
      }
      .teddy-blush.left {
        left: 15px;
      }
      .teddy-blush.right {
        right: 15px;
      }

      /* Mensaje */
      .message {
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 25px;
        color: #581c87;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.45);
        padding: 15px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .sparkles {
        color: #c084fc;
        font-size: 1.3rem;
        animation: spin 3s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* Contenedor de Botones */
      .btn-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-top: 10px;
      }

      .btn {
        background: linear-gradient(135deg, #c084fc, #a855f7);
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 1.1rem;
        font-family: "Fredoka One", cursive;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(168, 85, 247, 0.3);
        transition:
          transform 0.2s,
          box-shadow 0.3s;
        width: 85%;
        z-index: 15;
      }

      .btn:hover {
        background: linear-gradient(135deg, #a855f7, #9333ea);
        box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
      }

      /* Botón "No" absoluto por toda la pantalla */
      #btn-escape {
        background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
        font-size: 0.9rem;
        padding: 10px 20px;
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        color: #6b21a8;
        border: 2px solid #d8b4fe;
        border-radius: 50px;
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        position: fixed;
        top: 72%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition:
          top 0.2s ease,
          left 0.2s ease;
        width: auto;
        white-space: nowrap;
        z-index: 2000;
        cursor: pointer;
      }

      .heart-pop {
        position: absolute;
        pointer-events: none;
        font-size: 1.5rem;
        animation: flyUp 1.5s ease-out forwards;
        z-index: 20;
      }

      @keyframes flyUp {
        0% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(-160px) scale(1.4);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="youtube-player"
      style="position: absolute; width: 0; height: 0; pointer-events: none"
    ></div>

    <canvas id="snowCanvas"></canvas>

    <div class="card">
      <div class="title">Lo Siento...</div>

      <div class="teddy-bear">
        <div class="teddy-ear left"><div class="teddy-ear-inner"></div></div>
        <div class="teddy-ear right"><div class="teddy-ear-inner"></div></div>
        <div class="teddy-head">
          <div class="teddy-eye left"></div>
          <div class="teddy-eye right"></div>
          <div class="teddy-blush left"></div>
          <div class="teddy-blush right"></div>
          <div class="teddy-muzzle">
            <div class="teddy-nose"></div>
          </div>
        </div>
      </div>

      <div class="message">
        <span class="sparkles">✦</span>
        Perdón por haber hecho que te sintieras mal. Lo último que quería era
        quitarte esa sonrisa tan hermosa. Eres una persona súper importante para
        mí y me duele mucho estar así contigo.
        <span class="sparkles">✦</span>
        <br /><br />
        ¿Me dejas compensártelo? 💜
      </div>

      <div class="btn-container">
        <button class="btn" id="btn-forgive" onclick="celebrate()">
          ¡Te perdono!
        </button>
      </div>
    </div>

    <button id="btn-escape">Nop, no te perdono</button>

    <script>
      // --- REPRODUCTOR DE MÚSICA AUTOMÁTICO INTEGRADO ---
      let player;

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("youtube-player", {
          height: "0",
          width: "0",
          videoId: "BP1zLBvb8h4",
          playerVars: {
            autoplay: 1,
            controls: 0,
            loop: 1,
            playlist: "BP1zLBvb8h4",
          },
          events: {
            onReady: onPlayerReady,
          },
        });
      }

      function onPlayerReady(event) {
        event.target.playVideo();
        player.setVolume(100);
      }

      // Asegura que la música arranque con la primera interacción en cualquier parte de la pantalla
      document.body.addEventListener(
        "click",
        () => {
          if (player && player.getPlayerState() !== 1) {
            player.playVideo();
            player.setVolume(100);
          }
        },
        { once: true },
      ); // Se ejecuta solo la primera vez que interactúe

      document.body.addEventListener(
        "touchstart",
        () => {
          if (player && player.getPlayerState() !== 1) {
            player.playVideo();
            player.setVolume(100);
          }
        },
        { once: true },
      );

      // --- NIEVE LILA Y BLANCA ---
      const canvas = document.getElementById("snowCanvas");
      const ctx = canvas.getContext("2d");
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const numFlakes = 45;
      const flakes = [];
      const snowColors = ["#ffffff", "#f3e8ff", "#e9d5ff", "#d8b4fe"];

      for (let i = 0; i < numFlakes; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.5 + 1,
          d: Math.random() * numFlakes,
          color: snowColors[Math.floor(Math.random() * snowColors.length)],
          speed: Math.random() * 0.8 + 0.4,
        });
      }

      function drawSnow() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < numFlakes; i++) {
          const f = flakes[i];
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
          ctx.fillStyle = f.color;
          ctx.fill();
          f.y += f.speed;
          f.x += Math.sin(f.d) * 0.3;
          if (f.y > height) {
            flakes[i] = {
              x: Math.random() * width,
              y: 0,
              r: f.r,
              d: f.d,
              color: f.color,
              speed: f.speed,
            };
          }
        }
        requestAnimationFrame(drawSnow);
      }
      drawSnow();

      // --- BOTÓN TRAVIESO POR TODA LA PANTALLA ---
      const btnEscape = document.getElementById("btn-escape");

      function moveButton(e) {
        if (e) e.preventDefault();

        const padding = 60;
        const maxX = window.innerWidth - btnEscape.offsetWidth - padding;
        const maxY = window.innerHeight - btnEscape.offsetHeight - padding;

        const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        btnEscape.style.left = randomX + "px";
        btnEscape.style.top = randomY + "px";
        btnEscape.style.transform = "none";
      }

      btnEscape.addEventListener("mouseenter", moveButton);
      btnEscape.addEventListener("touchstart", moveButton);

      // --- CELEBRACIÓN ---
      function celebrate() {
        for (let i = 0; i < 18; i++) {
          setTimeout(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart-pop");
            heart.innerText = ["💜", "✨", "🔮", "🧸", "☁️"][
              Math.floor(Math.random() * 5)
            ];
            const btn = document.getElementById("btn-forgive");
            const rect = btn.getBoundingClientRect();
            heart.style.left =
              rect.left + rect.width / 2 + (Math.random() * 100 - 50) + "px";
            heart.style.top = rect.top + window.scrollY + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
          }, i * 80);
        }

        setTimeout(() => {
          alert(
            "¡Siiii! Gracias por tu hermoso corazoncito. Prometo hacer las cosas súper bien y cuidarte siempre. Te quiero muchísimo 🧸💜",
          );
        }, 600);
      }
    </script>
  </body>
</html>
